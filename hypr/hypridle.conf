# Hypridle configuration file for Hyprland on Arch Linux
# Implements: dim after 2 min, screen off after 3 min, lock after 10 min, suspend after 30 min
# Ensures swaylock at 10 min doesn’t wake display; lock screen shows only on user input (like Windows)
# Located at ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof swaylock || swaylock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim screen to 10% brightness after 2 minutes (120 seconds)
listener {
    timeout = 120
    on-timeout = brightnessctl set 10%
    on-resume = brightnessctl set 50%
}

# Turn off display after 3 minutes (180 seconds)
listener {
    timeout = 150
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock session with swaylock after 10 minutes (600 seconds), don’t wake display
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Suspend system after 30 minutes (1800 seconds)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
